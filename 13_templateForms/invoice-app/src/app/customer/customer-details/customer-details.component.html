@if (customer()) {
    <div>
        <div style="margin-right: 10px; ">
            <img class="logo" [src]="customer()?.imageUrl"> <!-- <img src="assets/"-->
        </div>
        <form>
            <label>
                Vorname:
                <input type="text" name="firstname" [(ngModel)]="customer()!.firstname">
            </label>
        </form>
        <p>Stadt: {{customer()?.city}}</p>
    </div>
}
