<h1>Invoice Manager App</h1>
<div class="diff-container">
    <customer-list class="diff-left" [customers]="customerMockList"
        (customerSelected)="newCustomerSelected($event)"></customer-list>
    @defer (on idle) {
        <customer-details class="diff-right" [customer]="selectedCustomer()"></customer-details>
    } @placeholder {
        <div class="diff-right">Lade Kundendetails...</div>
    }
</div>
