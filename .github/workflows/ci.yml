name: CI

# Baut und testet jede Übung (Ordner NN_*/invoice-app) und prüft den Lehrserver.
# Neue Übungsordner werden automatisch erkannt (Ordner mit invoice-app/package.json).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    name: Übungen finden
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          projects=$(find . -mindepth 3 -maxdepth 3 -path './*/invoice-app/package.json' \
            | sed 's#^\./##; s#/package.json$##' | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "Gefunden: $projects"
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  exercises:
    name: ${{ matrix.project }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # Angular 21 braucht Node ^20.19 || ^22.12 || >=24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npx ng build
      - name: Tests (Vitest)
        run: npx ng test --watch=false

  typescript-zahlenraten:
    name: TypeScript Zusatzübung (00)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kompilieren und mit der eingecheckten app.js vergleichen
        run: |
          d=00_typescript_guess_a_number
          out="$RUNNER_TEMP/out_$d"
          npx -y -p typescript@5.9 tsc -p "$d" --outDir "$out"
          node --check "$out/app.js"
          diff -u "$d/app.js" "$out/app.js" || { echo "::error::$d/app.js passt nicht zu app.ts (bitte mit tsc neu erzeugen)"; exit 1; }

  typescript-primer:
    name: TypeScript Primer (01)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01_typescript_primer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 01_typescript_primer/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typen der Musterlösungen prüfen
        run: npm run check:loesung
      - name: Musterlösungen ausführen und Ausgabe vergleichen
        run: npm run pruefe-loesungen
      - name: Aufgaben-Dateien (src) dürfen nur die beabsichtigten Fehler haben
        run: |
          npx tsc --noEmit > "$RUNNER_TEMP/src-fehler.txt" || true
          cat "$RUNNER_TEMP/src-fehler.txt"
          # Übung 1: genau 6 beabsichtigte Fehler, Übung 2: 2 Fehler bis die Parameter ergänzt sind
          test "$(grep -c 'src/uebung-1-typfehler.ts.*error TS' "$RUNNER_TEMP/src-fehler.txt")" = "6"
          test "$(grep -c 'src/uebung-2-funktionen.ts.*error TS' "$RUNNER_TEMP/src-fehler.txt")" = "2"
          test "$(grep 'error TS' "$RUNNER_TEMP/src-fehler.txt" | grep -vc 'uebung-1-typfehler\|uebung-2-funktionen')" = "0"

  server:
    name: Lehrserver (server/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-fund
      - name: Sicherheitsprüfung (hohe Schwachstellen brechen ab)
        run: npm audit --audit-level=high
      - name: Smoke-Test der REST-Schnittstelle
        run: |
          node server.js &
          pid=$!
          for i in $(seq 1 20); do curl -fs localhost:3000/api/customer >/dev/null && break; sleep 0.5; done
          curl -fs localhost:3000/api/customer | jq -e '.data | length > 0'
          curl -fs localhost:3000/api/customer/1 | jq -e '.data.id == 1'
          kill $pid
