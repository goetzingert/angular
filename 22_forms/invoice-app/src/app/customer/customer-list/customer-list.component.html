<div>
    <ul>
        <li  [class.discontinued]="customer.discontinued" [class.selected]="isSelectedCustomer(customer)"  (click)="listItemClicked($event, customer)" *ngFor="let customer of customers">
            <a [routerLink]="[customer.id]">
            <span>{{customer.firstname}}</span>
            <span *ngIf="customer.city"> : {{customer.city}}</span>
        </a></li>
    </ul>
</div>
